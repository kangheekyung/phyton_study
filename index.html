<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파이썬 온라인 실습실</title>
    <!-- Pyodide 엔진 불러오기 -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .status-bar {
            background-color: #e2f0d9;
            color: #385723;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: center;
        }
        label {
            font-weight: bold;
            color: #555;
            display: block;
            margin-bottom: 5px;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            resize: vertical;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .output-container {
            margin-top: 20px;
        }
        pre {
            background-color: #1e1e1e;
            color: #dcdcdc;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            min-height: 100px;
            max-height: 250px;
            overflow-y: auto;
            white-space: pre-wrap;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🐍 초간단 파이썬 실습실</h1>
        
        <!-- 엔진 로딩 상태 표시바 -->
        <div id="statusBar" class="status-bar">파이썬 엔진을 불러오는 중입니다... 잠시만 기다려주세요!</div>

        <!-- 코드 입력 영역 -->
        <label for="codeBox">파이썬 코드 입력:</label>
        <textarea id="codeBox" placeholder="print('안녕하세요!')">print("Hello, Python!")
for i in range(1, 4):
    print(f"{i}번째 반복입니다.")</textarea>

        <!-- 실행 버튼 -->
        <button id="runBtn" onclick="runCode()" disabled>코드 실행</button>

        <!-- 결과 출력 영역 -->
        <div class="output-container">
            <label>실행 결과:</label>
            <pre id="outputBox">결과가 여기에 표시됩니다.</pre>
        </div>
    </div>

    <script>
        let pyodide = null;

        // 페이지 로드시 Pyodide 엔진 초기화
        async function initPyodide() {
            try {
                pyodide = await loadPyodide({
                    indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/"
                });
                
                // 로딩 완료 후 상태 변경 및 버튼 활성화
                document.getElementById("statusBar.textContent" || "statusBar").innerText = "✨ 파이썬 엔진 준비 완료! 코드를 실행해 보세요.";
                document.getElementById("statusBar").style.backgroundColor = "#d4edda";
                document.getElementById("statusBar").style.color = "#155724";
                document.getElementById("runBtn").disabled = false;
            } catch (error) {
                document.getElementById("statusBar").innerText = "❌ 파이썬 엔진 로딩 실패: 인터넷 연결을 확인해주세요.";
                document.getElementById("statusBar").style.backgroundColor = "#f8d7da";
                document.getElementById("statusBar").style.color = "#721c24";
            }
        }

        initPyodide();

        // 코드 실행 함수
        async function runCode() {
            if (!pyodide) {
                alert("아직 파이썬 엔진이 준비되지 않았습니다.");
                return;
            }

            const code = document.getElementById("codeBox").value;
            const outputBox = document.getElementById("outputBox");
            outputBox.innerText = "실행 중...";

            try {
                // 파이썬 표준 출력을 가로채기 위한 코드 세팅
                pyodide.runRunPython = pyodide.runPython;
                pyodide.runPython(`
import sys
import io
sys.stdout = io.StringIO()
                `);

                // 학생이 작성한 코드 실행
                pyodide.runPython(code);

                // 출력값 가져오기
                const stdout = pyodide.runPython("sys.stdout.getvalue()");
                
                // 출력 창에 결과 반영 (출력값이 없으면 빈 문자열 혹은 메시지)
                outputBox.innerText = stdout === "" ? "(출력 결과가 없습니다)" : stdout;

            } catch (error) {
                // 에러 발생 시 에러 메시지 출력
                outputBox.innerText = "에러 발생:\n" + error.message;
            }
        }
    </script>

</body>
</html>
